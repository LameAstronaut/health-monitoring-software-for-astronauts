services:
  api:
    image: memento-mori-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      ASTRA_MODE: DEMO
      ASTRA_DEPLOYMENT_PROFILE: public_demo
      ASTRA_DATABASE_URL: sqlite:////data/astra.db
      ASTRA_DEMO_TOKEN: ${ASTRA_DEMO_TOKEN:?Run server.sh configure first}
      ASTRA_ALLOWED_ORIGIN: ${ASTRA_ALLOWED_ORIGIN:?Set the public origin}
    volumes:
      - app_data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  worker:
    image: memento-mori-api:local
    pull_policy: never
    command: [astra-simulator, --controlled, --api-url, 'http://127.0.0.1:8000']
    network_mode: service:api
    environment:
      ASTRA_DEMO_TOKEN: ${ASTRA_DEMO_TOKEN:?Run server.sh configure first}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging
  web:
    image: memento-mori-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    environment:
      ASTRA_SITE_ADDRESS: ${ASTRA_SITE_ADDRESS:?Set the site address}
    ports:
      - '${ASTRA_HTTP_PORT:-80}:80'
      - '${ASTRA_HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  app_data:
  caddy_data:
  caddy_config:
